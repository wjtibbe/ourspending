name: Deploy to Supabase (production)

# Runs only after change reaches main. Never runs from a pull request and
# never from a feature branch.
on:
  push:
    branches: [main]
    # Nothing here can change the database or a function, so a docs-only or
    # frontend-only merge does not spend a production deploy. Vercel handles
    # the frontend from main independently of this workflow.
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy.yml'
  # Manual re-run, e.g. after rotating a secret or to redeploy unchanged code.
  workflow_dispatch:

permissions:
  contents: read

# A second merge cannot start a deploy while one is mid-flight. Not cancelling
# in progress: interrupting a run *between* `db push` and `functions deploy`
# would leave the schema ahead of the code.
concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run test suite
        run: |
          set -euo pipefail
          failed=0
          for f in tests/*.test.ts tests/*.test.js; do
            echo "::group::$f"
            if node --experimental-strip-types "$f"; then
              echo "OK $f"
            else
              echo "::error file=$f::test file failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

  deploy:
    name: Migrate and deploy functions
    runs-on: ubuntu-latest
    # A failing test suite stops the deploy: this job never starts.
    needs: test
    environment: production
    steps:
      # The exact merged commit, not a moving ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Non-interactive: the CLI reads SUPABASE_ACCESS_TOKEN from the
      # environment, so there is no `supabase login` and no token on any
      # command line (which would be visible in the process list).
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      # Visible in the log before anything is applied, so the run itself
      # records which migrations were considered pending.
      - name: Show migration status
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked

      # Applies ONLY migrations not already recorded in the project's
      # supabase_migrations.schema_migrations table. Already-applied files are
      # skipped, never re-run.
      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked

      # Explicit allowlist, not `--all`. Three functions in this repo are
      # marked OBSOLETE or INACTIVE in their own headers and must not be
      # revived by a deploy: provider-connect, wise-sync, inbound-email.
      # verify_jwt for each function comes from supabase/config.toml.
      #
      # Reached only if every migration above succeeded: `set -e` plus the
      # failure of any prior step stops the job.
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for fn in \
            gmail-sync \
            gmail-oauth-start \
            gmail-oauth-callback \
            gmail-disconnect \
            scan-receipt \
            calendar-feed
          do
            echo "::group::deploy $fn"
            supabase functions deploy "$fn" \
              --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
            echo "::endgroup::"
          done

      - name: Summary
        if: success()
        run: |
          {
            echo "### Supabase production deploy complete"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Migrations: applied (pending only)"
            echo "- Functions deployed: gmail-sync, gmail-oauth-start,"
            echo "  gmail-oauth-callback, gmail-disconnect, scan-receipt, calendar-feed"
          } >> "$GITHUB_STEP_SUMMARY"
